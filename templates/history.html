<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Prediction History</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef8ff;color:#172033;}header{background:#1f4e79;color:white;padding:20px;text-align:center;}table{width:90%;margin:30px auto;border-collapse:collapse;background:white;box-shadow:0 8px 18px rgba(0,0,0,0.1);}th,td{border:1px solid #ddd;padding:12px;text-align:center;}th{background:#1f4e79;color:white;}</style></head><body><header><h1>Medical Prediction History</h1></header><table><tr><th>Age</th><th>BMI</th><th>Blood Pressure</th><th>Glucose</th><th>Cholesterol</th><th>Heart Rate</th><th>Prediction</th></tr>{% for prediction in historical_data %}<tr><td>{{ prediction[0] }}</td><td>{{ prediction[1] }}</td><td>{{ prediction[2] }}</td><td>{{ prediction[3] }}</td><td>{{ prediction[4] }}</td><td>{{ prediction[5] }}</td><td>{{ prediction[6] }}</td></tr>{% endfor %}</table></body></html>
