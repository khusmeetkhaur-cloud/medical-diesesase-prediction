<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Medical Disease Prediction</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#eef8ff;color:#172033;}header{background:#1f4e79;color:white;padding:20px;text-align:center;}nav{background:#ffffff;text-align:center;padding:12px;box-shadow:0 3px 12px rgba(0,0,0,0.08);}nav a{margin:0 15px;text-decoration:none;color:#1f4e79;font-weight:bold;}main{width:88%;margin:35px auto;display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:start;}.left-box,.right-box{background:white;padding:25px;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,0.12);}.description{text-align:center;margin-bottom:18px;}.description h2{color:#1f4e79;margin-bottom:6px;}.form-container label{display:block;margin-bottom:6px;font-weight:bold;}.form-container input,.form-container select{width:100%;padding:11px;margin-bottom:15px;border:1px solid #c9d3e6;border-radius:8px;box-sizing:border-box;}.form-container button{width:100%;background:#1f4e79;color:white;border:none;padding:12px 20px;cursor:pointer;border-radius:8px;font-size:16px;font-weight:bold;}.form-container button:hover{background:#00a6a6;}.hero-img{text-align:center;margin-bottom:18px;}.hero-img img{width:100%;max-height:260px;object-fit:contain;border-radius:15px;}.side-image{display:grid;grid-template-columns:1fr 1fr;gap:18px;}.image-card{background:#f8fbff;border-radius:15px;padding:14px;text-align:center;border:1px solid #e4ebf7;}.image-card img{width:100%;height:130px;object-fit:contain;border-radius:12px;}.image-card p{margin:8px 0 0;font-weight:bold;color:#1f4e79;}.Prediction{width:88%;margin:0 auto 30px auto;display:flex;justify-content:center;}.Prediction h2{background:white;padding:16px 30px;border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,0.12);color:#1f4e79;}@media(max-width:900px){main{grid-template-columns:1fr}.side-image{grid-template-columns:1fr 1fr}}@media(max-width:520px){.side-image{grid-template-columns:1fr}}
</style></head>
<body><header><h1>Medical Disease Prediction</h1></header><nav><a href="/">Home</a><a href="/project">Project</a><a href="/about">About</a><a href="/contact">Contact</a></nav>
<main><section class="left-box"><div class="description"><h2>Enter Patient Details</h2><p>This tool predicts disease category using Machine Learning.</p></div><div class="form-container"><form action="{{ url_for('project') }}" method="POST">
<label>Age</label><input type="text" name="age" placeholder="Enter age" required>
<label>BMI</label><input type="text" name="bmi" placeholder="Enter BMI" required>
<label>Blood Pressure</label><input type="text" name="blood_pressure" placeholder="Enter blood pressure" required>
<label>Glucose Level</label><input type="text" name="glucose_level" placeholder="Enter glucose level" required>
<label>Cholesterol</label><input type="text" name="cholesterol" placeholder="Enter cholesterol" required>
<label>Heart Rate</label><input type="text" name="heart_rate" placeholder="Enter heart rate" required>
<label>Gender</label><select name="gender" required><option value="1">Male</option><option value="0">Female</option></select>
<label>Smoking</label><select name="smoking" required><option value="0">No</option><option value="1">Yes</option></select>
<label>Alcohol</label><select name="alcohol" required><option value="0">No</option><option value="1">Yes</option></select>
<label>Physical Activity</label><select name="physical_activity" required><option value="0">Low</option><option value="1">Medium</option><option value="2">High</option></select>
<label>Family History</label><select name="family_history" required><option value="0">No</option><option value="1">Yes</option></select>
<button type="submit">Predict Disease</button></form></div></section>
<section class="right-box"><div class="hero-img"><img src="{{ url_for('static', filename='doctor_ai.png') }}" alt="Doctor AI"></div><div class="side-image"><div class="image-card"><img src="{{ url_for('static', filename='blood_test.png') }}" alt="Blood Test"><p>Blood Test</p></div><div class="image-card"><img src="{{ url_for('static', filename='heart_health.png') }}" alt="Heart Health"><p>Heart Health</p></div><div class="image-card"><img src="{{ url_for('static', filename='medical_report.png') }}" alt="Medical Report"><p>Medical Report</p></div><div class="image-card"><img src="{{ url_for('static', filename='ai_diagnosis.png') }}" alt="AI Diagnosis"><p>AI Diagnosis</p></div></div></section></main>
{% if prediction %}<div class="Prediction"><h2>Prediction Result : {{ prediction }}</h2></div>{% endif %}</body></html>
